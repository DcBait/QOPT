[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qopt"
version = "0.1.0"
description = "A small peephole optimizer for quantum circuits, with verified rewrites and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
bench = ["qiskit>=1.0", "matplotlib>=3.7"]
dev = ["pytest>=7", "qiskit>=1.0", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["qopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
